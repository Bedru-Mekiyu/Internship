name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  MONGODB_VERSION: '7.0'

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "nc -z localhost 27017"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017 2>/dev/null; then
              echo "MongoDB port is open"
              sleep 2
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Run backend tests
        run: npm test -- --runInBand --no-coverage
        env:
          MONGODB_URI: mongodb://localhost:27017/internship_test
          JWT_ACCESS_SECRET: ci_access_secret_for_testing_only_min_32_chars
          JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only_min_32_chars
          JWT_VERIFY_SECRET: ci_verify_secret_for_testing_only_min_32_chars
          JWT_RESET_SECRET: ci_reset_secret_for_testing_only_min_32_chars
          NODE_ENV: test

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --no-coverage

  frontend-e2e-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "nc -z localhost 27017"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017 2>/dev/null; then
              echo "MongoDB port is open"
              sleep 2
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Start backend
        working-directory: ../backend
        run: |
          npm ci
          nohup npm run start:dev > backend.log 2>&1 &
          sleep 10
          curl -f http://localhost:5000/healthz || (cat backend.log && exit 1)
        env:
          MONGODB_URI: mongodb://localhost:27017/internship_test
          JWT_ACCESS_SECRET: ci_access_secret_for_testing_only_min_32_chars
          JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only_min_32_chars
          JWT_VERIFY_SECRET: ci_verify_secret_for_testing_only_min_32_chars
          JWT_RESET_SECRET: ci_reset_secret_for_testing_only_min_32_chars
          NODE_ENV: test
          PORT: 5000

      - name: Run E2E tests
        run: npx playwright test --project=chromium --reporter=line
        env:
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:5000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  notify:
    name: Notify Status
    needs:
      - backend-checks
      - backend-tests
      - frontend-checks
      - frontend-unit-tests
      - frontend-e2e-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs status
        run: |
          BACKEND_CHECKS="${{ needs.backend-checks.result }}"
          BACKEND_TESTS="${{ needs.backend-tests.result }}"
          FRONTEND_CHECKS="${{ needs.frontend-checks.result }}"
          FRONTEND_UNIT="${{ needs.frontend-unit-tests.result }}"
          FRONTEND_E2E="${{ needs.frontend-e2e-tests.result }}"

          echo "Backend Checks: $BACKEND_CHECKS"
          echo "Backend Tests: $BACKEND_TESTS"
          echo "Frontend Checks: $FRONTEND_CHECKS"
          echo "Frontend Unit: $FRONTEND_UNIT"
          echo "Frontend E2E: $FRONTEND_E2E"

          if [ "$BACKEND_CHECKS" != "success" ] || [ "$BACKEND_TESTS" != "success" ] || [ "$FRONTEND_CHECKS" != "success" ] || [ "$FRONTEND_UNIT" != "success" ] || [ "$FRONTEND_E2E" != "success" ]; then
            echo "❌ CI FAILED"
            exit 1
          fi

          echo "✅ CI PASSED"