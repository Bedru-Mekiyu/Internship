name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JWT_ACCESS_SECRET: ci_access_secret_for_testing_only_min_32_chars
  JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only_min_32_chars
  JWT_VERIFY_SECRET: ci_verify_secret_for_testing_only_min_32_chars
  JWT_RESET_SECRET: ci_reset_secret_for_testing_only_min_32_chars
  PAYMENT_WEBHOOK_SECRET: ci_webhook_secret_for_testing_only_min_32_chars
  BASE_URL: http://127.0.0.1:5000

jobs:
  # ─────────────────────────────────────────────────────────────
  # BACKEND LINT & TYPE CHECK
  # ─────────────────────────────────────────────────────────────
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Lint code
        run: npm run lint || true

      - name: Type check
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────
  # BACKEND TESTS (Parallel)
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Build TypeScript
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run unit tests
        run: npm test -- --testPathIgnorePatterns="security|persistence|error-handling" --maxWorkers=2
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      - name: Run integration tests
        run: npm test -- --testPathPattern="security" --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

  # ─────────────────────────────────────────────────────────────
  # FRONTEND LINT & TYPE CHECK
  # ─────────────────────────────────────────────────────────────
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Lint code
        run: npm run lint || true

      - name: Type check
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────
  # FRONTEND TESTS
  # ─────────────────────────────────────────────────────────────
  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run unit tests
        run: npm test -- --run

  # ─────────────────────────────────────────────────────────────
  # FRONTEND E2E TESTS
  # ─────────────────────────────────────────────────────────────
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e -- --grep "smoke"
        env:
          CI: true
          PLAYWRIGHT_REUSE_BUILD: '1'
          PLAYWRIGHT_RETRIES: 2

      - name: Run E2E auth tests
        run: npm run test:e2e -- --grep "auth"
        env:
          CI: true
          PLAYWRIGHT_REUSE_BUILD: '1'
          PLAYWRIGHT_RETRIES: 2

      - name: Run E2E security tests
        run: npm run test:e2e -- --grep "security|authorization"
        env:
          CI: true
          PLAYWRIGHT_REUSE_BUILD: '1'
          PLAYWRIGHT_RETRIES: 2

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # NOTIFICATION (runs after all jobs)
  # ─────────────────────────────────────────────────────────────
  notify:
    needs: [backend-checks, backend-tests, frontend-checks, frontend-unit-tests, frontend-e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report status
        run: |
          BACKEND_PASSED=true
          FRONTEND_PASSED=true
          
          if [ "${{ needs.backend-checks.result }}" != "success" ]; then
            BACKEND_PASSED=false
          fi
          
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            BACKEND_PASSED=false
          fi
          
          if [ "${{ needs.frontend-checks.result }}" != "success" ]; then
            FRONTEND_PASSED=false
          fi
          
          if [ "${{ needs.frontend-e2e-tests.result }}" != "success" ]; then
            FRONTEND_PASSED=false
          fi
          
          if [ "$BACKEND_PASSED" = "false" ] || [ "$FRONTEND_PASSED" = "false" ]; then
            echo "❌ CI FAILED"
            echo ""
            echo "Backend checks: ${{ needs.backend-checks.result }}"
            echo "Backend tests: ${{ needs.backend-tests.result }}"
            echo "Frontend checks: ${{ needs.frontend-checks.result }}"
            echo "Frontend unit: ${{ needs.frontend-unit-tests.result }}"
            echo "Frontend E2E: ${{ needs.frontend-e2e-tests.result }}"
            exit 1
          fi
          
          echo "✅ CI PASSED"
          echo "All tests passed successfully!"