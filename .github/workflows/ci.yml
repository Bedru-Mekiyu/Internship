name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  MONGODB_VERSION: '7.0'

jobs:
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run ESLint
        run: npm run lint
        working-directory: backend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: backend

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017 >/dev/null 2>&1; then
              echo "MongoDB port is open"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Run backend tests
        env:
          MONGODB_URI: mongodb://localhost:27017/internship_test
          JWT_SECRET: test_jwt_secret_key_for_testing_only
          JWT_REFRESH_SECRET: test_refresh_secret_key_for_testing_only
          STRIPE_SECRET_KEY: sk_test_ci_test_stripe_secret
          STRIPE_WEBHOOK_SECRET: whsec_test
          NODE_ENV: test
          GLOBAL_API_RATE_LIMIT_MAX: 50
          GLOBAL_API_RATE_LIMIT_WINDOW_MS: 60000
        run: npm test -- --testTimeout=30000 --forceExit
        working-directory: backend

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run unit tests
        run: npm test -- --run
        working-directory: frontend

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if nc -z localhost 27017 >/dev/null 2>&1; then
              echo "MongoDB port is open"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Start backend
        run: |
          cd backend
          npm run dev &
          BACKEND_PID=$!
          echo "BACKEND_PID=$BACKEND_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            if curl -f http://localhost:5000/healthz >/dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
        env:
          MONGODB_URI: mongodb://localhost:27017/internship_test
          JWT_SECRET: test_jwt_secret_key_for_testing_only
          JWT_REFRESH_SECRET: test_refresh_secret_key_for_testing_only
          STRIPE_SECRET_KEY: sk_test_ci_test_stripe_secret
          STRIPE_WEBHOOK_SECRET: whsec_test
          NODE_ENV: test
          PORT: 5000

      - name: Run E2E tests
        run: npx playwright test --project=chromium --reporter=line
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:5000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  notify:
    name: Notify Status
    needs: [backend-checks, backend-tests, frontend-checks, frontend-unit-tests, frontend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job status
        run: |
          if [[ "${{ needs.backend-checks.result }}" != "success" ]] ||
             [[ "${{ needs.backend-tests.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-checks.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-e2e.result }}" != "success" ]]; then
            echo "Some jobs failed"
            exit 1
          fi
          echo "All jobs passed"