name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  JWT_ACCESS_SECRET: ci_access_secret_for_testing_only_min_32_chars
  JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only_min_32_chars
  JWT_VERIFY_SECRET: ci_verify_secret_for_testing_only_min_32_chars
  JWT_RESET_SECRET: ci_reset_secret_for_testing_only_min_32_chars
  PAYMENT_WEBHOOK_SECRET: ci_webhook_secret_for_testing_only_min_32_chars
  BASE_URL: http://127.0.0.1:5000

jobs:
  # ─────────────────────────────────────────────────────────────
  # BACKEND LINT & TYPE CHECK
  # ─────────────────────────────────────────────────────────────
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────
  # BACKEND TESTS - ALL TESTS (Unit + Integration + Security)
  # ─────────────────────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Build TypeScript
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run ALL tests (Unit + Integration + Security)
        run: npm test
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          MONGODB_URI: mongodb://localhost:27017/test_mit_lms
          JWT_ACCESS_SECRET: ${{ env.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          JWT_VERIFY_SECRET: ${{ env.JWT_VERIFY_SECRET }}
          JWT_RESET_SECRET: ${{ env.JWT_RESET_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ env.PAYMENT_WEBHOOK_SECRET }}
          CORS_ORIGIN: "*"
          FRONTEND_URL: http://localhost:5173

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # FRONTEND LINT & TYPE CHECK
  # ─────────────────────────────────────────────────────────────
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────
  # FRONTEND UNIT TESTS
  # ─────────────────────────────────────────────────────────────
  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run unit tests
        run: npm test -- --run

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # FRONTEND E2E TESTS (All Browsers)
  # ─────────────────────────────────────────────────────────────
  frontend-e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests (all browsers)
        run: npm run test:e2e
        env:
          CI: true
          PLAYWRIGHT_REUSE_BUILD: '1'
          PLAYWRIGHT_RETRIES: 2

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # NOTIFICATION (runs after all jobs)
  # ─────────────────────────────────────────────────────────────
  notify:
    needs: [backend-checks, backend-tests, frontend-checks, frontend-unit-tests, frontend-e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Report status
        run: |
          BACKEND_PASSED=true
          FRONTEND_PASSED=true
          
          if [ "${{ needs.backend-checks.result }}" != "success" ]; then
            BACKEND_PASSED=false
          fi
          
          if [ "${{ needs.backend-tests.result }}" != "success" ]; then
            BACKEND_PASSED=false
          fi
          
          if [ "${{ needs.frontend-checks.result }}" != "success" ]; then
            FRONTEND_PASSED=false
          fi

          if [ "${{ needs.frontend-unit-tests.result }}" != "success" ]; then
            FRONTEND_PASSED=false
          fi

          if [ "${{ needs.frontend-e2e-tests.result }}" != "success" ]; then
            FRONTEND_PASSED=false
          fi
          
          if [ "$BACKEND_PASSED" = "false" ] || [ "$FRONTEND_PASSED" = "false" ]; then
            echo "❌ CI FAILED"
            echo ""
            echo "Backend checks: ${{ needs.backend-checks.result }}"
            echo "Backend tests: ${{ needs.backend-tests.result }}"
            echo "Frontend checks: ${{ needs.frontend-checks.result }}"
            echo "Frontend unit: ${{ needs.frontend-unit-tests.result }}"
            echo "Frontend E2E: ${{ needs.frontend-e2e-tests.result }}"
            exit 1
          fi
          
          echo "✅ CI PASSED"
          echo "All tests passed successfully!"