services:
  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URL: mongodb://mongodb:27017/mit_lms
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_VERIFY_SECRET: ${JWT_VERIFY_SECRET}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://your-frontend.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://your-frontend.com}
      BASE_URL: ${BASE_URL:-https://your-backend.com}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      GLOBAL_API_RATE_LIMIT_MAX: 600
      GLOBAL_API_RATE_LIMIT_WINDOW_MS: 900000
      TRUST_PROXY: 1
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://your-backend.com}
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
